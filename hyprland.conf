# Solid black/silver window chrome with Rosso Corsa active states.

$f40_rosso_corsa = rgba(b91e2fa6)
$f40_inactive_border = rgba(3a3a3acc)

general {
    border_size = 2
    col.active_border = $f40_rosso_corsa
    col.inactive_border = $f40_inactive_border
}

group {
    col.border_active = $f40_rosso_corsa
    col.border_inactive = $f40_inactive_border
}

decoration {
    rounding = 10
    active_opacity = 0.98
    inactive_opacity = 0.94
    fullscreen_opacity = 1.0
    dim_inactive = true
    dim_strength = 0.08

    blur {
        enabled = true
        size = 5
        passes = 3
        ignore_opacity = true
        new_optimizations = true
        xray = false
        noise = 0.012
        contrast = 0.98
        brightness = 0.92
        vibrancy = 0.0
        vibrancy_darkness = 0.0
    }

    shadow {
        enabled = true
        range = 16
        render_power = 3
        color = rgba(000000dd)
        color_inactive = rgba(000000aa)
    }
}
