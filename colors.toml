# F40 Nocturne · Nero Daytona
# Warm graphite ground instead of a black void, silver text, Rosso Corsa
# matched to the paint in the backgrounds (OKLCH hue ~26), Giallo Modena kept
# rare. The quieter hues come from the backgrounds themselves: glass sage,
# slate windows, amber street lamps.
# After edits: omarchy theme set f40-nocturne

mode = "dark"

# UI chrome (bar, menus, focus) - Rosso Corsa as the paint reads under light.
accent = "#d8232a"
# Selected rows / visual selection - warm carbon with bright silver text.
selection = "#2c2627"
selection_foreground = "#f2ede9"
# Comments, line numbers, dim UI - warm steel.
muted = "#756c6a"

# Nero Daytona ground: tinted toward the shadows of the photos, never #000.
background = "#141213"
dark_background = "#0f0d0e"
darker_background = "#0b0a0a"
lighter_background = "#1e1b1c"

# Silver field, leaning slightly warm like the studio floor.
foreground = "#e4dfdb"
dark_foreground = "#8c8482"
light_foreground = "#b6afab"
bright_foreground = "#f4f0ec"

red = "#e5493f"       # Rosso - errors, deletions (readable as text: 4.8:1)
yellow = "#f0c23b"    # Giallo Modena / Sabelt - user, warnings, types
orange = "#e8914a"    # Amber street lamps - numbers
green = "#a5b38b"     # Glass sage (Nocturne windows) - strings, sizes
cyan = "#90b4b0"      # Cool glass - params
blue = "#8fa4c2"      # Slate windows - functions, dates, folders
magenta = "#ec5f45"   # Rosso Scuderia, lighter and warmer than red - keywords, agent labels

bright_red = "#f0675d"
bright_yellow = "#f6d266"
bright_green = "#bac6a2"
bright_cyan = "#a9c8c4"
bright_blue = "#a9bbd4"
bright_magenta = "#f47d66"

# Window borders (Hyprland is generated from these).
hyprland_active_border = "rgba(d8232aee)"
hyprland_inactive_border = "rgba(3a3334cc)"
